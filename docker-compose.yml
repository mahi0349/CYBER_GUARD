services:
  postgres:
    image: postgres:16-alpine
    container_name: quantumvault_db
    environment:
      POSTGRES_USER: quantumvault
      POSTGRES_PASSWORD: quantumvault_secure_password
      POSTGRES_DB: quantumvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumvault -d quantumvault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
