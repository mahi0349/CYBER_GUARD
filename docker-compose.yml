services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberguard_db
    environment:
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard_secure_password
      POSTGRES_DB: cyberguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard -d cyberguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
